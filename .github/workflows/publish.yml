name: Publish (npm + CDN)

# Publish on a version TAG (not a bare push to main), so shipping a release is an
# explicit, auditable action rather than any push to main. Release ritual:
#   1. bump "version" in package.json + add a CHANGELOG entry, merge to main
#   2. git tag v0.1.2 && git push origin v0.1.2   -> this workflow publishes
# The version-guard step below still skips if that version is already on npm.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance + (optional) OIDC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.17.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Publish only if the version is new
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER already on npm — skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing $NAME@$VER"
          fi

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Push the self-contained browser bundle to cdn.replayfy.app (R2). Skips
      # cleanly if the R2 secrets aren't configured, so npm-only setups still work.
      - name: Upload CDN bundle to R2
        if: steps.check.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VER: ${{ steps.check.outputs.version }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::notice::R2 secrets not set — skipping CDN upload."; exit 0
          fi
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          # Immutable, versioned path + a stable v1 alias, both long-cached.
          for KEY in "v1/replay.global.js" "v$VER/replay.global.js"; do
            aws s3 cp dist/replay.global.js "s3://$R2_BUCKET/$KEY" \
              --endpoint-url "$ENDPOINT" \
              --content-type "application/javascript" \
              --cache-control "public, max-age=31536000, immutable"
          done
          echo "::notice::CDN updated: https://cdn.replayfy.app/v1/replay.global.js"
